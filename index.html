<style>

<script id="menu-data">
const NAMES={lentil:'Чечевица готовая',buckwheat:'Гречка готовая',chicken:'Куриное филе готовое',turkey:'Бедро индейки готовое',pollock:'Минтай готовый',
  broccoli:'Брокколи готовая',cauli:'Цветная капуста готовая',beans:'Стручковая фасоль готовая',mix:'Овощная смесь готовая',
  oats:'Овсяные хлопья, сухие',flax:'Лён молотый',strawberry:'Клубника',walnut:'Грецкие орехи',cottage:'Творог 2 %',cherry:'Вишня',skir:'Скир 1,5 %',greek:'Греческий йогурт 2 %',apple:'Яблоко',seeds:'Тыквенные семечки',isolate:'Изолят на воде'};
const CK={
  lentil:{n:'Красная чечевица',y:2.8,state:'сухой',store:3,water:2,how:'Без замачивания. Залейте водой, варите 15 минут.'},
  buckwheat:{n:'Гречка',y:2.7,state:'сухой',store:3,water:2,how:'Закипятите и держите 15 минут на малом огне.'},
  chicken:{n:'Куриное филе',y:.72,state:'сырого',store:3,how:'Рукав или фольга, специи без соли, духовка 180 °C, 35–40 минут.'},
  turkey:{n:'Бедро индейки',y:.72,state:'сырого',store:3,how:'Рукав или фольга, специи без соли, духовка 180 °C, 35–40 минут.'},
  pollock:{n:'Филе минтая',y:.8,state:'сырого',store:2,how:'Фольга, лимон и специи, духовка 180 °C, 20–25 минут.'}
};
const VEG=['broccoli','cauli','beans','mix'];
const MEAL_INFO={b:['08:00','Завтрак'],s:['11:00','Перекус'],l:['14:00','Обед'],p:['17:00','Полдник'],d:['20:00','Ужин']};
const OIL=['Масло','1 ч. л.'], WHITES=['Яичные белки','3 шт.'], EGG=['Варёное яйцо','1 шт.'];
const m=(id,items,k,p,f,c)=>({id,items,k,p,f,c});
const BF=m('b',[['oats',50],WHITES,['flax',10],['strawberry',100],['walnut',10]],387,21,14,35);
const SN=m('s',[['cottage',100],['cherry',100]],153,19,2,12);
const SKIR=m('p',[['skir',150],['apple',80]],137,16,2,15);
const ISO=m('p',[['isolate',25],['apple',80],['seeds',5]],162,23,3,10);
const DAYS=[
 [BF,SN,m('l',[['lentil',120],['turkey',80],['broccoli',200],OIL],411,38,15,24),SKIR,m('d',[['pollock',100],['cauli',200],['beans',100],OIL],222,27,7,8)],
 [BF,SN,m('l',[['buckwheat',120],['chicken',80],['mix',200],OIL],381,33,9,32),ISO,m('d',[['pollock',100],['broccoli',150],['beans',100],OIL],228,27,7,11)],
 [BF,SN,m('l',[['lentil',120],['chicken',80],['broccoli',200],OIL],386,41,9,24),SKIR,m('d',[['cottage',100],EGG,['beans',140],OIL],278,28,14,10)],
 [BF,SN,m('l',[['buckwheat',140],['turkey',80],['broccoli',200],OIL],422,32,16,34),m('p',[['greek',150],['seeds',5]],138,17,5,5),m('d',[['pollock',100],['mix',210],OIL],220,25,7,10)],
 [BF,SN,m('l',[['lentil',120],['chicken',80],['beans',200],OIL],386,40,9,27),m('p',[['skir',150],['apple',80],['seeds',5]],165,17,4,16),m('d',[['pollock',100],['cauli',200],['broccoli',100],OIL],222,28,7,8)],
 [BF,SN,m('l',[['lentil',120],['turkey',80],['broccoli',100],['beans',100],OIL],411,36,15,26),ISO,m('d',[['pollock',100],['mix',200],OIL],216,25,7,9)],
 [BF,SN,m('l',[['lentil',120],['chicken',80],['broccoli',200],OIL],386,41,9,24),SKIR,m('d',[['cottage',100],EGG,['cauli',130],OIL],263,27,14,7)]
];
const SHOP=[
 ['Мясо и рыба',[['Куриное филе','500 г'],['Бедро индейки','350 г'],['Филе минтая','700 г']]],
 ['Молочное и яйца',[['Творог 2 %','900 г'],['Скир 1,5 %','600 г'],['Греческий йогурт 2 %','150 г'],['Яйца','25 шт.']]],
 ['Крупы',[['Овсяные хлопья','350 г'],['Красная чечевица','250 г'],['Гречка','100 г']]],
 ['Замороженные овощи',[['Брокколи','1,2 кг'],['Стручковая фасоль','700 г'],['Овощная смесь без картофеля и риса','700 г'],['Цветная капуста','600 г']]],
 ['Фрукты и ягоды',[['Клубника замороженная','700 г'],['Вишня замороженная','700 г'],['Яблоки','500 г'],['Лимон','1 шт.']]],
 ['Орехи, семена, масло',[['Грецкие орехи','70 г'],['Льняное семя','70 г'],['Тыквенные семечки','20 г'],['Рапсовое или оливковое масло','70 мл']]]
];
const dayTotals=d=>DAYS[d].reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c}),{k:0,p:0,f:0,c:0});
</script>

<script>
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOW_FULL=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const DOW_ACC=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MEAL_GEN={b:'завтрак',s:'перекус',l:'обед',p:'полдник',d:'ужин'};
const KEY='menu1300';
const blank=()=>({meals:{},water:{},stepper:{},log:{},cook:{},shop:{},doctor:{},updatedAt:0});
let state=blank();
try{const raw=localStorage.getItem(KEY);if(raw)state=Object.assign(blank(),JSON.parse(raw))}catch(e){}

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const noon=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x};
const addDays=(d,n)=>{const x=noon(d);x.setDate(x.getDate()+n);return x};
const today=()=>noon(new Date());
const idx=d=>(d.getDay()+6)%7;
const nextDow=(from,t)=>addDays(from,(t-idx(from)+7)%7);
const human=d=>d.getDate()+' '+MONTHS[d.getMonth()];
const fmt=n=>String(n).replace('.',',');
const itemLabel=it=>Array.isArray(it)&&typeof it[1]==='number'?[NAMES[it[0]],it[1]+' г']:it;

let tab=['today','cook','shop','week','log'].includes(location.hash.slice(1))?location.hash.slice(1):'today';
let viewDay=idx(today());
let cookSel=defaultCook();
let draft={};
let syncState='local';
const storageOK=(()=>{try{localStorage.setItem(KEY+'-t','1');const ok=localStorage.getItem(KEY+'-t')==='1';localStorage.removeItem(KEY+'-t');return ok}catch(e){return false}})();
let backupText='',restoreText='',backupMsg='';
let copyText='';
let confirmShop=false;

function defaultCook(){const t=idx(today());return (t===0||t===1||t===2)?{preset:'wed'}:{preset:'sun'}}
function resolveCook(){
  const t=today();
  if(cookSel.preset==='sun')return{from:nextDow(t,6),days:[6,0,1,2]};
  if(cookSel.preset==='wed')return{from:nextDow(t,2),days:[3,4,5]};
  if(cookSel.preset==='tomorrow')return{from:t,days:[idx(addDays(t,1))]};
  return{from:t,days:cookSel.days||[]};
}
function planCooking(from,days){
  const ordered=days.map(d=>({d,date:nextDow(from,d)})).sort((a,b)=>a.date-b.date);
  const cooked={},veg=[];let berries={strawberry:0,cherry:0};
  for(const o of ordered){
    const v={};
    for(const meal of DAYS[o.d]){
      for(const it of meal.items){
        const k=it[0];
        if(CK[k]){(cooked[k]=cooked[k]||{total:0,parts:[],over:[]});cooked[k].total+=it[1];cooked[k].parts.push({d:o.d,meal:meal.id,g:it[1]});
          const gap=Math.round((o.date-from)/864e5);if(gap>CK[k].store)cooked[k].over.push(o.d)}
        if(VEG.includes(k))v[k]=(v[k]||0)+it[1];
        if(k in berries)berries[k]+=it[1];
      }
    }
    veg.push({d:o.d,v});
  }
  return{cooked,veg,berries,ordered};
}
const rawOf=(k,g)=>Math.ceil(g/CK[k].y/5)*5;

/* ---------- Saving ---------- */
let ref=null,writing=false,dirty=false,timer=null;
function prune(){
  const cut=iso(addDays(today(),-60));
  for(const s of [state.meals,state.water,state.stepper])for(const k of Object.keys(s))if(k<cut)delete s[k];
  for(const k of Object.keys(state.cook))if(k.slice(0,10)<cut)delete state.cook[k];
}
function touch(){
  state.updatedAt=Date.now();prune();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  dirty=true;clearTimeout(timer);timer=setTimeout(flush,700);
}
async function flush(){
  if(!ref||writing||!dirty)return;
  writing=true;dirty=false;
  try{await ref.set(JSON.parse(JSON.stringify(state)));syncState='cloud'}
  catch(e){if(e&&e.code==='unavailable'){dirty=true;setTimeout(flush,1500+Math.random()*1500)}else{syncState='local';ref=null;if(tab==='log')render()}}
  writing=false;
  if(dirty)flush();
}
async function connect(){
  if(!window.claude||!window.claude.use){syncState='local';if(tab==='log')render();return}
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  const id=user?await user.id():null;
  if(!db||!id){syncState='local';if(tab==='log')render();return}
  ref=db.doc('data/users/'+id+'/tracker');
  const wait=setTimeout(()=>{if(syncState==='connecting'){syncState='stale';if(tab==='log')render()}},10000);
  ref.onSnapshot(snap=>{
    if(snap.metadata.fromCache&&!snap.exists)return;
    if(!snap.metadata.fromCache){clearTimeout(wait);syncState='cloud'}
    if(snap.exists){
      const d=snap.data();
      if((d.updatedAt||0)>state.updatedAt&&!dirty){
        state=Object.assign(blank(),JSON.parse(JSON.stringify(d)));
        try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
        render();return;
      }
    }
    if((!snap.exists||(snap.data().updatedAt||0)<state.updatedAt)&&state.updatedAt&&!snap.metadata.fromCache){dirty=true;flush()}
    if(tab==='log')renderSyncOnly();
  },e=>{clearTimeout(wait);syncState='local';ref=null;if(tab==='log')render()});
}
function renderSyncOnly(){const el=document.getElementById('sync');if(el)el.textContent=syncLabel()}
function syncLabel(){
  return storageOK?'Записи хранятся только на этом телефоне, интернет не нужен. Время от времени сохраняйте резервную копию.':'Этот браузер не сохраняет записи: после закрытия отметки пропадут. Меню и расчёты работают. Откройте файл в другом браузере.';
}

/* ---------- Views ---------- */
const eatenFor=(date,d)=>{const m=state.meals[date]||{};return DAYS[d].filter(x=>m[x.id]).reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c}),{k:0,p:0,f:0,c:0})};
function mealCard(x,date){
  const done=!!(state.meals[date]||{})[x.id];const [t,n]=MEAL_INFO[x.id];
  return `<section class="card meal ${done?'done':''}">
    <div class="meal-top"><div><div class="time">${t}</div><h2>${n}</h2></div>
    <button class="tick" role="checkbox" aria-checked="${done}" aria-label="${n}: съедено" data-act="meal" data-id="${x.id}">✓</button></div>
    <ul class="items">${x.items.map(i=>{const [a,b]=itemLabel(i);return `<li><span>${a}</span><span>${b}</span></li>`}).join('')}</ul>
    <div class="meta">${x.k} ккал · Б ${x.p} · Ж ${x.f} · У ${x.c}</div></section>`;
}
function viewToday(){
  const t=today(),mon=addDays(t,-idx(t)),date=addDays(mon,viewDay),ds=iso(date),isToday=ds===iso(t);
  const tot=dayTotals(viewDay),ate=eatenFor(ds,viewDay),pct=Math.min(100,Math.round(ate.k/tot.k*100));
  const water=state.water[ds]||0,step=!!state.stepper[ds];

function viewCook(){

function viewWeek(){
  const rows=DAYS.map((_,i)=>{const t=dayTotals(i),sum=t.p*4+t.f*9+t.c*4,p=Math.round(t.p*400/sum),c=Math.round(t.c*400/sum),f=100-p-c;return `<tr><td>${DOW[i]}</td><td>${t.k}</td><td>${t.p}</td><td>${t.f}</td><td>${t.c}</td><td>${p}/${f}/${c}</td></tr>`}).join('');

    <p class="how">Цифры примерные, погрешность 5–10 %. Углеводы указаны без клетчатки, а клетчатки около 30–35 г в день. Увеличивайте её постепенно, за 1–2 недели.</p></section>
   ${cards}
   <section class="card"><h2>Замены</h2><ul class="items"><li><span>Куриное филе 80 г</span><span>индейка 65 г</span></li><li><span>Гречка 140 г</span><span>чечевица 130 г</span></li><li><span>Скир 150 г</span><span>йогурт 130 г</span></li><li><span>Скир 150 г</span><span>творог 95 г</span></li></ul>
    <p class="how">Овощи взаимозаменяемы 1:1. Изолят можно поставить вместо скира в любой день. Если от чечевицы вздувает живот, замените её в дне 7 на гречку 140 г.</p></section>`;
}
function bpAlert(s,d){return (s>=180||d>=120)}

   <section class="card"><div class="row"><div><span class="sub">Сейчас</span><div class="big">${last!==null?fmt(last):'—'} <span class="sub">кг</span></div></div><div style="text-align:right"><span class="sub">С начала</span><div class="big">${change===null?'—':(change>0?'+':'')+fmt(change)} <span class="sub">кг</span></div></div></div>

     <label class="field" for="restoreFile">Восстановить из файла<input id="restoreFile" type="file" accept=".json,.txt,application/json,text/plain"></label>

const ICONS={today:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',cook:'<path d="M5 11h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM3 11h18M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/>',shop:'<path d="M6 8h12l-1 12H7zM9 8a3 3 0 0 1 6 0"/>',week:'<path d="M5 6h14M5 12h14M5 18h14"/>',log:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3"/>'};
const TABS=[['today','Сегодня'],['cook','Готовка'],['shop','Покупки'],['week','Неделя'],['log','Дневник']];
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="tab" data-t="${k}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${l}</button>`).join('');

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},2200)}
function go(t){tab=t;try{location.hash=t}catch(e){}render();window.scrollTo(0,0)}
function curDate(){const t=today();return iso(addDays(addDays(t,-idx(t)),viewDay))}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;

  if(a==='tab')return go(b.dataset.t);

  if(a==='water'){const d=curDate(),i=+b.dataset.i,c=state.water[d]||0;state.water[d]=(c===i+1)?i:i+1;touch();return render()}

  if(a==='shop'){const k=b.dataset.k;if(state.shop[k])delete state.shop[k];else state.shop[k]=1;touch();return render()}
  if(a==='shopAsk'){confirmShop=true;return render()}
  if(a==='shopCancel'){confirmShop=false;return render()}

  if(a==='logDel'){delete state.log[b.dataset.k];touch();toast('Запись удалена');return render()}
  if(a==='backupShow'){backupText=JSON.stringify(state);backupMsg='';return render()}
  if(a==='backupSave'){
    try{const url=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));const l=document.createElement('a');l.href=url;l.download='menu-1300-kopiya-'+iso(today())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Копия сохранена в загрузки')}
    catch(e){backupText=JSON.stringify(state);render()}

  }
  if(a==='restore'){

      state=Object.assign(blank(),d);restoreText='';backupMsg='';touch();toast('Записи восстановлены')}

    const lines=Object.keys(state.log).sort().map(k=>{const e=state.log[k],p=x=>x?x[0]+'/'+x[1]:'—';const [y,mo,da]=k.split('-');return `${da}.${mo}.${y}: вес ${e.w?fmt(e.w)+' кг':'—'}, давление утром ${p(e.am)}, вечером ${p(e.pm)}`}).join('\n');

  }

document.addEventListener('submit',ev=>{
  if(ev.target.id!=='logForm')return;ev.preventDefault();
  const num=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?null:n};
  const w=num(draft.w),pair=(s,d)=>{const a=num(s),b=num(d);if(a===null&&b===null)return null;if(a===null||b===null||a<60||a>280||b<30||b>180)return 'bad';return [Math.round(a),Math.round(b)]};
  const am=pair(draft.amS,draft.amD),pm=pair(draft.pmS,draft.pmD);
  if(draft.w&&(w===null||w<30||w>250)){draft.err='Проверьте вес: укажите его в килограммах, например 74,5.';return render()}
  if(am==='bad'||pm==='bad'){draft.err='Проверьте давление: нужны обе цифры, верхняя и нижняя, например 125 и 80.';return render()}
  if(w===null&&!am&&!pm){draft.err='Заполните вес или давление, чтобы сохранить запись.';return render()}
  const date=draft.date||iso(today()),e=state.log[date]=state.log[date]||{};
  if(w!==null)e.w=w;if(am)e.am=am;if(pm)e.pm=pm;
  draft={date};touch();toast('Запись сохранена');render();
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==tab){tab=h;render();window.scrollTo(0,0)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='today')render()});
render();
</script>
